name: 每日爬蟲與摘要通知

on:
  schedule:
    # 每天 UTC 00:00 執行（對應臺灣時間 UTC+8 早上 08:00）
    - cron: '0 0 * * *'
  workflow_dispatch: # 支援在 GitHub 介面手動觸發執行

jobs:
  run-crawler-and-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 1. 執行爬蟲更新論文與消息
        run: python crawler/main.py

      - name: 2. 執行每日摘要通知
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: python crawler/notify.py

      - name: 自動提交與推送資料更新
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add papers.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "自動更新論文與消息資料 [skip ci]" && git push)
